          async function validateStagedPackage(pkgDir) {
            checkNoSymlinksTree(pkgDir);
            checkJsPackage(pkgDir);

            const manifestPath = path.join(pkgDir, 'manifest.json');
            const mStat = fs.lstatSync(manifestPath, { throwIfNoEntry: false });
            requireCond(mStat && !mStat.isSymbolicLink() && mStat.isFile(), 'Staged package missing manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const pluginId = typeof manifest.id === 'string' ? manifest.id.trim() : '';
            requireCond(pluginId.length > 0, 'Missing manifest.id');
            requireCond(pluginId !== 'block-diagnostics', 'Reserved plugin id: block-diagnostics');

            for (const field of ['name', 'summary']) {
              const translations = manifest[field];
              requireCond(translations && typeof translations === 'object' && !Array.isArray(translations), `manifest.${field} must be an object`);
              for (const loc of ['zh', 'en']) {
                const value = translations[loc];
                requireCond(typeof value === 'string' && value.trim().length > 0, `Missing manifest.${field}.${loc}`);
                if (loc === 'en') {
                  requireCond(!CHINESE.test(value), `manifest.${field}.en: Chinese text in ${JSON.stringify(value)}`);
                }
              }
            }
            checkText(manifest, 'zh', 'manifest');
            checkContributesEn(manifest.contributes);

            const zhReadme = readStrictReadme(pkgDir, 'README.md');
            const enReadme = readStrictReadme(pkgDir, 'README.en.md');
            requireCond(HAN.test(stripHtmlComments(zhReadme)), 'README.md must contain visible Chinese text');
            requireCond(!CHINESE.test(enReadme), 'README.en.md must contain English-only text');
            requireCond(/[A-Za-z]/.test(stripHtmlComments(enReadme)), 'README.en.md must contain at least one visible ASCII letter');
            checkText(zhReadme, 'zh', 'README.md');
            checkText(enReadme, 'en', 'README.en.md');
            requireCond(zhReadme !== enReadme, 'The two README files must differ');

            const surfaces = declaredSurfaces(manifest);
            const entryPath = resolveEntryJS(pkgDir, manifest);

            const harnessDir = fs.mkdtempSync(path.join(os.tmpdir(), 'block-sync-gate-'));
            try {
              const { loaderPath, sdkPath, runnerPath } = buildSmokeHarnessFiles(harnessDir);
              const cases = [];
              for (const [layout, capabilities] of Object.entries(LAYOUTS)) {
                for (const locale of ['zh', 'en']) {
                  cases.push({ layout, capabilities, locale });
                }
              }

              const settled = await Promise.allSettled(
                cases.map(async (c, idx) => {
                  const tempRoot = path.join(harnessDir, `case-${idx}`);
                  fs.mkdirSync(tempRoot, { recursive: true });
                  const configPath = path.join(harnessDir, `cfg-${idx}.json`);
                  const outPath = path.join(harnessDir, `out-${idx}.json`);
                  fs.writeFileSync(
                    configPath,
                    JSON.stringify({
