          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          requireCond(manifest.app === 'blockmd', "manifest.app must be 'blockmd'");
          const pluginId = String(manifest.id || '').trim();
          requireCond(/^[a-z0-9][a-z0-9-]{1,47}$/.test(pluginId), `invalid id: ${pluginId}`);
          const baseVer = String(manifest.version || '').trim();
