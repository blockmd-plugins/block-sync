            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function resolveTagSha(repo, rel) {
            if (!rel) return '';
            const tag = rel.tag_name;
            try {
              const s = sh('git', ['rev-parse', `${tag}^{commit}`]);
              if (/^[0-9a-f]{40}$/.test(s)) return s;
            } catch {}
            try {
