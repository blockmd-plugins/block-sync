name: Daily Release

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动检查；有新的打包内容且当日未发版时自动递增版本号发版（08:15 由 store-index 自动采集）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish a new patch release even without new package changes"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release-notes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan version and package plugin
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFile, execFileSync, spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { promisify } from 'node:util';

          const execFileAsync = promisify(execFile);

          const CHINESE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI = /[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙\u20e3\ufe00-\ufe0f\u{1f000}-\u{1faff}]/u;
          const FORBIDDEN_IMPORT_RE = /(?:^|[\s;])import\s+(?:[^'"]*\s+from\s+)?['"](?:node:|qjs:|fs|path|os|crypto|child_process|http|https|net|tls|url|module)['"]/m;
          const MAX_README_BYTES = 512 * 1024;
          const NOTEBOOK_NAME = '示例笔记本';
          const NOTE_NAME = '示例笔记.md';
          const LAYOUTS = {
            legacy: [],
            form: ['checklist', 'form_layout', 'multi_notebook', 'kv_tooltip'],
          };

          function requireCond(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          function sh(cmd, args, opts = {}) {
            return execFileSync(cmd, args, { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, ...opts }).trim();
          }

          function succeeds(cmd, args) {
            return spawnSync(cmd, args, { stdio: 'ignore' }).status === 0;
          }

          function summary(msg) {
            console.log(msg);
            const sPath = process.env.GITHUB_STEP_SUMMARY;
            if (sPath) {
              fs.appendFileSync(sPath, `${msg}\n`, 'utf8');
            }
          }

          function setOutput(outputs) {
            const oPath = process.env.GITHUB_OUTPUT;
            if (oPath) {
              const lines = Object.entries(outputs).map(([k, v]) => `${k}=${v}\n`).join('');
              fs.appendFileSync(oPath, lines, 'utf8');
            }
          }

          function checkText(value, locale, context, { allowFixture = false } = {}) {
            if (typeof value === 'string') {
              let text = value;
              if (allowFixture) {
                text = text.replaceAll(NOTEBOOK_NAME, '').replaceAll(NOTE_NAME, '');
              }
              requireCond(!EMOJI.test(text), `${context}: emoji in ${JSON.stringify(value)}`);
              if (locale.toLowerCase().startsWith('en')) {
                requireCond(!CHINESE.test(text), `${context}: Chinese text in ${JSON.stringify(value)}`);
              }
            } else if (Array.isArray(value)) {
              value.forEach((child, index) => checkText(child, locale, `${context}[${index}]`, { allowFixture }));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                checkText(key, 'zh', `${context}.<key>`, { allowFixture: false });
                checkText(child, locale, `${context}.${key}`, { allowFixture });
              }
            }
          }

          function checkContributesEn(value, context = 'manifest.contributes') {
            if (Array.isArray(value)) {
              value.forEach((child, index) => checkContributesEn(child, `${context}[${index}]`));
            } else if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                if (key === 'en') {
                  checkText(child, 'en', `${context}.en`);
                } else {
                  checkContributesEn(child, `${context}.${key}`);
                }
              }
            }
          }

          function declaredSurfaces(manifest) {
            const surfaces = [...(manifest.surfaces || [])];
            const contributes = manifest.contributes || {};
            for (const sec of contributes.settings_sections || []) {
              surfaces.push(`settings_section:${sec.id}`);
            }
            for (const panel of contributes.panels || []) {
              surfaces.push(`panel:${panel.id}`);
            }
            for (const dialog of contributes.dialogs || []) {
              surfaces.push(`dialog:${dialog.id}`);
            }
            requireCond(surfaces.length > 0, 'manifest must declare at least one surface');
            return [...new Set(surfaces)];
          }

          function checkNoSymlinksTree(pkgDir) {
            const rootStat = fs.lstatSync(pkgDir, { throwIfNoEntry: false });
            requireCond(rootStat && !rootStat.isSymbolicLink() && rootStat.isDirectory(), `Release package dir must be a non-symlink directory: ${pkgDir}`);
            const walk = (dir) => {
              for (const name of fs.readdirSync(dir).sort()) {
                const fullPath = path.join(dir, name);
                const st = fs.lstatSync(fullPath);
                requireCond(!st.isSymbolicLink(), `Symlink is not allowed in release package: ${path.relative(pkgDir, fullPath)}`);
                if (st.isDirectory()) {
                  walk(fullPath);
                }
              }
            };
            walk(pkgDir);
          }

          function stripHtmlComments(text) {
            return text
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<!--[\s\S]*$/g, '')
              .trim();
          }

          function readStrictReadme(pkgDir, filename) {
            const fullPath = path.join(pkgDir, filename);
            const st = fs.lstatSync(fullPath, { throwIfNoEntry: false });
            requireCond(st && !st.isSymbolicLink() && st.isFile(), `${filename} must be a non-symlink regular file`);
            const raw = fs.readFileSync(fullPath);
            requireCond(raw.length <= MAX_README_BYTES, `${filename} exceeds ${MAX_README_BYTES} bytes`);
            let text;
            try {
              text = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch (err) {
              throw new Error(`${filename} must be valid UTF-8: ${err.message}`);
            }
            text = text.replace(/^\ufeff/, '').trim();
            requireCond(text.length > 0, `${filename} must not be empty`);
            return text;
          }

          function resolveEntryJS(pkgDir, manifest) {
            const entry = manifest.entry;
            requireCond(entry && typeof entry === 'object' && !Array.isArray(entry), 'manifest.entry must be an object');
            const jsRel = entry.js;
            requireCond(typeof jsRel === 'string' && jsRel.trim() !== '', 'manifest.entry.js must be a non-empty string');
            requireCond(jsRel === jsRel.trim(), 'manifest.entry.js must not have leading/trailing whitespace');
            requireCond(!jsRel.includes('\0') && !path.isAbsolute(jsRel), `Invalid entry.js: ${JSON.stringify(jsRel)}`);
            const normalized = jsRel.replace(/\\/g, '/');
            const parts = normalized.split('/').filter(Boolean);
            requireCond(!parts.includes('..') && parts.length > 0, `entry.js escapes package: ${JSON.stringify(jsRel)}`);
            const target = path.join(pkgDir, ...parts);
            const st = fs.lstatSync(target, { throwIfNoEntry: false });
            requireCond(st && !st.isSymbolicLink() && st.isFile(), `entry.js missing or symlink: ${JSON.stringify(jsRel)}`);
            const resolvedPkg = fs.realpathSync(pkgDir);
            const resolvedTarget = fs.realpathSync(target);
            requireCond(resolvedTarget.startsWith(`${resolvedPkg}${path.sep}`), `entry.js escapes package: ${JSON.stringify(jsRel)}`);
            const src = fs.readFileSync(target, 'utf8');
            requireCond(
              src.includes("'/runtime/block-sdk.js'") || src.includes('"/runtime/block-sdk.js"'),
              'entry.js must import /runtime/block-sdk.js',
            );
            return target;
          }

          function checkJsPackage(pkgDir) {
            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'block-sync-syntax-'));
            try {
              let idx = 0;
              const walk = (dir) => {
                for (const name of fs.readdirSync(dir).sort()) {
                  const fullPath = path.join(dir, name);
                  const st = fs.lstatSync(fullPath);
                  if (st.isDirectory()) {
                    walk(fullPath);
                  } else if (st.isFile()) {
                    const rel = path.relative(pkgDir, fullPath);
                    requireCond(!name.endsWith('.py'), `Unexpected Python file in JS plugin package: ${rel}`);
                    if (name.endsWith('.js') || name.endsWith('.mjs')) {
                      const src = fs.readFileSync(fullPath, 'utf8');
                      requireCond(!FORBIDDEN_IMPORT_RE.test(src), `Forbidden Node/qjs built-in import in ${rel}`);
                      idx += 1;
                      const checkPath = path.join(tmpDir, `check-${idx}.mjs`);
                      fs.writeFileSync(checkPath, src, 'utf8');
                      execFileSync(process.execPath, ['--check', checkPath], { stdio: 'pipe' });
                    }
                  }
                }
              };
              walk(pkgDir);
            } finally {
              fs.rmSync(tmpDir, { recursive: true, force: true });
            }
          }

          function buildSmokeHarnessFiles(harnessDir) {
            const loaderSrc = `
          import fs from 'node:fs';
          import { fileURLToPath } from 'node:url';

          let sdkUrl = '';
          let pkgPrefix = '';

          export function initialize(data) {
            sdkUrl = data.sdkUrl;
            pkgPrefix = data.pkgPrefix;
          }

          export async function resolve(specifier, context, nextResolve) {
            if (specifier === '/runtime/block-sdk.js') {
              return { shortCircuit: true, url: sdkUrl };
            }
            return nextResolve(specifier, context);
          }

          export async function load(url, context, nextLoad) {
            if (pkgPrefix && url.startsWith(pkgPrefix) && url.endsWith('.js')) {
              return {
                shortCircuit: true,
                format: 'module',
                source: fs.readFileSync(fileURLToPath(url), 'utf8'),
              };
            }
            return nextLoad(url, context);
          }
          `;

            const sdkSrc = `
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          export const state = {
            handler: null,
            notebook: '',
            notebookId: 'nb-smoke-1',
            notebookName: '',
            mirror: '',
            dataDir: '',
            notes: {},
            storage: {},
            storageWriteError: null,
            identityVerified: true,
            previousPaths: [],
            secrets: new Map(),
            logs: [],
            bgErrors: [],
            schedulerJobs: new Map(),
          };

          export function initState(opts) {
            state.notebook = opts.notebook;
            state.notebookId = opts.notebookId !== undefined ? opts.notebookId : 'nb-smoke-1';
            state.notebookName = opts.notebookName;
            state.mirror = opts.mirror;
            state.dataDir = opts.dataDir || '';
            state.notes = opts.notes;
            for (const [rel, content] of Object.entries(state.notes || {})) {
              const full = path.join(state.notebook, rel);
              fs.mkdirSync(path.dirname(full), { recursive: true });
              fs.writeFileSync(full, content, 'utf8');
            }
            state.storage = opts.storage;
            state.storageWriteError = null;
            state.identityVerified = opts.identityVerified !== undefined ? Boolean(opts.identityVerified) : true;
            state.previousPaths = Array.isArray(opts.previousPaths) ? [...opts.previousPaths] : [];
            state.secrets = new Map();
            state.logs = [];
            state.bgErrors = [];
            state.schedulerJobs = new Map();
          }

          export function serve(handler) {
            state.handler = handler;
          }

          export function notifyHost(_method, _params = {}) {}

          export function callHost(method, params = {}) {
            if (method === 'host.storage.get') {
              const key = params.key;
              if (!key) {
                return { data: { ...state.storage } };
              }
              const found = Object.prototype.hasOwnProperty.call(state.storage, key);
              return { found, value: found ? state.storage[key] : undefined };
            }
            if (method === 'host.storage.set') {
              if (state.storageWriteError) throw new Error(String(state.storageWriteError));
              state.storage[params.key] = params.value;
              return { ok: true };
            }
            if (method === 'host.storage.set_many') {
              if (state.storageWriteError) throw new Error(String(state.storageWriteError));
              for (const [k, v] of Object.entries(params.values || {})) {
                state.storage[k] = v;
              }
              return { ok: true };
            }
            if (method === 'host.notebooks.list') {
              const st = state.notebook ? fs.lstatSync(state.notebook, { throwIfNoEntry: false }) : null;
              const rootIdentity = st && st.isDirectory() && !st.isSymbolicLink() ? st.dev + ':' + st.ino : '';
              return {
                notebooks: [
                  {
                    ...(state.notebookId ? { id: state.notebookId } : {}),
                    path: state.notebook,
                    name: state.notebookName,
                    active: true,
                    previous_paths: [...state.previousPaths],
                    identity_verified: Boolean(state.identityVerified && rootIdentity),
                    root_identity: rootIdentity,
                  },
                ],
              };
            }
            if (method === 'host.notebooks.data_dir') {
              const reqPath = path.resolve(String(params.path || state.notebook || ''));
              const nbPath = path.resolve(String(state.notebook || ''));
              if (!nbPath || reqPath !== nbPath) {
                throw new Error('Unauthorized notebook root: ' + reqPath);
              }
              const st = fs.lstatSync(nbPath, { throwIfNoEntry: false });
              const rootIdentity = st && st.isDirectory() && !st.isSymbolicLink() ? st.dev + ':' + st.ino : '';
              const nbDataDir = state.dataDir ? path.join(state.dataDir, 'notebooks', state.notebookId || 'nb-smoke-1') : '';
              if (nbDataDir) fs.mkdirSync(nbDataDir, { recursive: true });
              return {
                ...(state.notebookId ? { id: state.notebookId } : {}),
                path: nbDataDir,
                notebook_path: state.notebook,
                name: state.notebookName,
                active: true,
                previous_paths: [...state.previousPaths],
                identity_verified: Boolean(state.identityVerified && rootIdentity),
                root_identity: rootIdentity,
              };
            }
            if (method === 'host.notes.list') {
              return { notes: Object.keys(state.notes).sort().map((p) => ({ path: p })) };
            }
            if (method === 'host.notes.read') {
              if (!Object.prototype.hasOwnProperty.call(state.notes, params.path)) {
                throw new Error('Note not found: ' + params.path);
              }
              const content = state.notes[params.path];
              return {
                content,
                revision: crypto.createHash('sha256').update(content, 'utf8').digest('hex'),
              };
            }
            if (method === 'host.notes.write') {
              state.notes[params.path] = params.content;
              const full = path.join(state.notebook, params.path);
              fs.mkdirSync(path.dirname(full), { recursive: true });
              fs.writeFileSync(full, params.content, 'utf8');
              return { ok: true };
            }
            if (method === 'host.notes.trash') {
              const p = params.path;
              if (!Object.prototype.hasOwnProperty.call(state.notes, p)) {
                return { ok: true, trashed: false };
              }
              const expected = params.expected_revision || '';
              const actual = crypto.createHash('sha256').update(state.notes[p], 'utf8').digest('hex');
              if (expected !== actual) {
                throw new Error('host.notes.trash: revision mismatch for ' + p);
              }
              delete state.notes[p];
              fs.rmSync(path.join(state.notebook, p), { force: true });
              return { ok: true, trashed: true };
            }
            if (method === 'host.fs.list_grants') {
              return {
                grants: [{ path: state.mirror, writable: true }],
                notebooks: [{ path: state.notebook, writable: true }],
                ...(state.dataDir ? { data_dir: state.dataDir } : {}),
              };
            }
            if (method === 'host.fs.stat') {
              const target = String(params.path || '');
              try {
                const st = params.lstat ? fs.lstatSync(target) : fs.statSync(target);
                return {
                  exists: true,
                  path: target,
                  name: path.basename(target),
                  is_dir: st.isDirectory(),
                  is_file: st.isFile(),
                  is_regular: st.isFile() && !st.isSymbolicLink(),
                  is_symlink: st.isSymbolicLink(),
                  size: st.size,
                  mtime_ms: st.mtimeMs,
                  mod_time_ms: st.mtimeMs,
                };
              } catch (err) {
                if (err && err.code === 'ENOENT') {
                  return { exists: false, path: target };
                }
                throw err;
              }
            }
            if (method === 'host.fs.list') {
              const dir = String(params.path || '');
              const entries = [];
              const walk = (cur, relBase) => {
                for (const de of fs.readdirSync(cur, { withFileTypes: true })) {
                  const full = path.join(cur, de.name);
                  const rel = relBase ? relBase + '/' + de.name : de.name;
                  const st = fs.lstatSync(full);
                  const isSymlink = st.isSymbolicLink();
                  entries.push({
                    path: full,
                    name: de.name,
                    rel_path: rel,
                    is_dir: st.isDirectory(),
                    is_file: st.isFile(),
                    is_regular: st.isFile() && !isSymlink,
                    is_symlink: isSymlink,
                    size: st.size,
                    mtime_ms: st.mtimeMs,
                    mod_time_ms: st.mtimeMs,
                  });
                  if (params.recursive && st.isDirectory() && !isSymlink) {
                    walk(full, rel);
                  }
                }
              };
              walk(dir, '');
              return { path: dir, entries };
            }
            if (method === 'host.fs.delete_data') {
              const base = String(state.dataDir || '');
              if (!base) throw new Error('host.fs.delete_data: data_dir not set');
              const cleanBase = path.resolve(base);
              const rawTarget = String(params.path || '');
              if (!rawTarget) throw new Error('host.fs.delete_data: empty path');
              const cleanTarget = path.resolve(rawTarget);
              const rel = path.relative(cleanBase, cleanTarget);
              if (!rel || rel === '.' || rel.startsWith('..') || path.isAbsolute(rel)) {
                throw Object.assign(new Error('host.fs.delete_data: path outside data_dir'), { code: -32001 });
              }
              if (rel === 'granted-paths.json' || rel === 'scheduler.json' || rel === 'state.json') {
                throw Object.assign(new Error('host.fs.delete_data: control file protected'), { code: -32001 });
              }
              const baseL = fs.lstatSync(cleanBase, { throwIfNoEntry: false });
              if (!baseL || baseL.isSymbolicLink() || !baseL.isDirectory()) {
                throw Object.assign(new Error('host.fs.delete_data: symlink detected'), { code: -32004 });
              }
              const parts = rel.split(path.sep).filter(Boolean);
              let cur = cleanBase;
              for (let i = 0; i < parts.length; i += 1) {
                cur = path.join(cur, parts[i]);
                const segL = fs.lstatSync(cur, { throwIfNoEntry: false });
                if (!segL) {
                  return { ok: true, deleted: false, path: cleanTarget };
                }
                if (segL.isSymbolicLink()) {
                  throw Object.assign(new Error('host.fs.delete_data: symlink in path'), { code: -32004 });
                }
                if (i < parts.length - 1 && !segL.isDirectory()) {
                  throw Object.assign(new Error('host.fs.delete_data: non-directory parent'), { code: -32001 });
                }
              }
              if (params.recursive) {
                const checkSubtree = (d) => {
                  for (const de of fs.readdirSync(d, { withFileTypes: true })) {
                    const p = path.join(d, de.name);
                    const s = fs.lstatSync(p);
                    if (s.isSymbolicLink()) {
                      throw Object.assign(new Error('host.fs.delete_data: symlink inside subtree'), { code: -32004 });
                    }
                    if (s.isDirectory()) checkSubtree(p);
                  }
                };
                if (fs.lstatSync(cleanTarget).isDirectory()) checkSubtree(cleanTarget);
                fs.rmSync(cleanTarget, { recursive: true, force: false });
              } else {
                const tgtL = fs.lstatSync(cleanTarget);
                if (tgtL.isDirectory()) fs.rmdirSync(cleanTarget);
                else fs.rmSync(cleanTarget, { force: false });
              }
              return { ok: true, deleted: true, path: cleanTarget };
            }
            if (method === 'host.fs.read') {
              const target = String(params.path || '');
              const buf = fs.readFileSync(target);
              if (params.encoding === 'base64') {
                return { path: target, encoding: 'base64', content_base64: buf.toString('base64'), size: buf.length };
              }
              return { path: target, encoding: 'utf8', content: buf.toString('utf8'), size: buf.length };
            }
            if (method === 'host.fs.write') {
              const target = String(params.path || '');
              if (params.mkdir_parents) {
                fs.mkdirSync(path.dirname(target), { recursive: true });
              }
              const data = params.content_base64 !== undefined
                ? Buffer.from(params.content_base64, 'base64')
                : Buffer.from(String(params.content ?? ''), 'utf8');
              fs.writeFileSync(target, data);
              return { ok: true, path: target, bytes: data.length };
            }
            if (method === 'host.fs.mkdir') {
              fs.mkdirSync(String(params.path || ''), { recursive: Boolean(params.recursive ?? params.parents ?? true) });
              return { ok: true };
            }
            if (method === 'host.fs.delete') {
              const target = String(params.path || '');
              if (params.recursive) {
                fs.rmSync(target, { recursive: true, force: true });
              } else {
                try {
                  const st = fs.lstatSync(target);
                  if (st.isDirectory()) {
                    fs.rmdirSync(target);
                  } else {
                    fs.rmSync(target, { force: true });
                  }
                } catch (err) {
                  if (!err || err.code !== 'ENOENT') throw err;
                }
              }
              return { ok: true };
            }
            if (method === 'host.fs.rename') {
              const fromPath = String(params.from || '');
              const toPath = String(params.to || '');
              if (params.mkdir_parents) {
                fs.mkdirSync(path.dirname(toPath), { recursive: true });
              }
              if (params.overwrite === false && fs.existsSync(toPath)) {
                const err = new Error('File already exists: ' + toPath);
                err.code = 'EEXIST';
                throw err;
              }
              fs.renameSync(fromPath, toPath);
              return { ok: true };
            }
            if (method === 'host.fs.copy') {
              const fromPath = String(params.from || '');
              const toPath = String(params.to || '');
              if (params.mkdir_parents) {
                fs.mkdirSync(path.dirname(toPath), { recursive: true });
              }
              if (params.overwrite === false && fs.existsSync(toPath)) {
                const err = new Error('File already exists: ' + toPath);
                err.code = 'EEXIST';
                throw err;
              }
              fs.copyFileSync(fromPath, toPath);
              const st = fs.statSync(toPath);
              return { ok: true, from: fromPath, to: toPath, size: st.size };
            }
            if (method === 'host.fs.atomic_swap') {
              const a = String(params.path_a || '');
              const b = String(params.path_b || '');
              const tmp = a + '.swap.' + process.pid;
              fs.renameSync(a, tmp);
              fs.renameSync(b, a);
              fs.renameSync(tmp, b);
              return { ok: true };
            }
            if (method === 'host.crypto.hash') {
              const h = crypto.createHash(params.algorithm || 'sha256');
              if (params.file_path) h.update(fs.readFileSync(params.file_path));
              else if (params.base64 !== undefined) h.update(Buffer.from(params.base64, 'base64'));
              else h.update(Buffer.from(String(params.text ?? ''), 'utf8'));
              const dig = h.digest();
              return { hex: dig.toString('hex'), base64: dig.toString('base64') };
            }
            if (method === 'host.log') {
              if (!Array.isArray(params.entries)) {
                throw new Error('host.log: entries must be a list');
              }
              state.logs.push(...params.entries);
              return { ok: true };
            }
            if (method === 'host.ui.toast') {
              return { ok: true, shown: true };
            }
            if (method === 'host.ui.open_settings') {
              return { ok: true };
            }
            if (method === 'host.ui.set_background_error') {
              state.bgErrors.push(params);
              return { ok: true };
            }
            if (method === 'host.ui.clear_background_error') {
              return { ok: true };
            }
            if (method === 'host.scheduler.register') {
              state.schedulerJobs.set(params.id, params);
              return { ok: true };
            }
            if (method === 'host.scheduler.unregister') {
              state.schedulerJobs.delete(params.id);
              return { ok: true };
            }
            if (method === 'host.secrets.get') {
              const k = String(params.key || '');
              return state.secrets.has(k) ? { found: true, value: state.secrets.get(k) } : { found: false, value: null };
            }
            if (method === 'host.secrets.set') {
              state.secrets.set(String(params.key || ''), String(params.value ?? ''));
              return { ok: true };
            }
            if (method === 'host.secrets.delete') {
              state.secrets.delete(String(params.key || ''));
              return { ok: true };
            }
            if (method === 'host.system.notify') {
              return { ok: true };
            }
            throw new Error('Unexpected host request: ' + method);
          }
          `;

            const runnerSrc = `
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { register } from 'node:module';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const {
            pkgDir,
            entryPath,
            locale,
            layout,
            capabilities,
            surfaces,
            actions,
            tempRoot,
            sdkPath,
            loaderPath,
            notebookName,
            noteName,
          } = payload;

          const CHINESE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe10-\ufe1f\ufe30-\ufe4f\uff00-\uffef\u{20000}-\u{2ffff}\u{30000}-\u{323af}]/u;
          const EMOJI = /[©®‼⁉™ℹ↔-↙↩↪⌚-⌛⌨⏏⏩-⏳⏸-⏺Ⓜ▪▫▶◀◻-◾\u2600-\u27bf⤴⤵⬅-⬇⬛⬜⭐⭕〰〽㊗㊙\u20e3\ufe00-\ufe0f\u{1f000}-\u{1faff}]/u;

          function requireCond(cond, msg) {
            if (!cond) throw new Error(msg);
          }

          function checkText(value, loc, ctx, allowFixture = false) {
            if (typeof value === 'string') {
              let txt = value;
              if (allowFixture) {
                txt = txt.replaceAll(notebookName, '').replaceAll(noteName, '');
              }
              requireCond(!EMOJI.test(txt), ctx + ': emoji in ' + JSON.stringify(value));
              if (loc.toLowerCase().startsWith('en')) {
                requireCond(!CHINESE.test(txt), ctx + ': Chinese text in ' + JSON.stringify(value));
              }
            } else if (Array.isArray(value)) {
              value.forEach((child, i) => checkText(child, loc, ctx + '[' + i + ']', allowFixture));
            } else if (value && typeof value === 'object') {
              for (const [k, v] of Object.entries(value)) {
                checkText(k, 'zh', ctx + '.<key>', false);
                checkText(v, loc, ctx + '.' + k, allowFixture);
              }
            }
          }

          function* controls(value) {
            if (Array.isArray(value)) {
              for (const child of value) yield* controls(child);
            } else if (value && typeof value === 'object') {
              const kind = value.kind;
              if (kind === 'segmented' || kind === 'select' || kind === 'switch') {
                const choices = kind === 'switch' ? [false, true] : value.options.map((opt) => opt.value);
                yield [value.id, value.value, choices];
              }
              for (const child of Object.values(value)) yield* controls(child);
            }
          }

          function checkRenders(rpc, surface, base) {
            const pending = [{}];
            const seen = new Set(['[]']);
            let count = 0;
            while (pending.length > 0) {
              const values = pending.shift();
              const page = rpc('plugin.render', { surface, values: { ...base, ...values } }).page;
              const ctx = locale + ' ' + surface + ' render ' + JSON.stringify(values);
              checkText(page, locale, ctx, true);
              const rendered = Array.from(controls(page));
              if (surface === 'settings_page') {
                requireCond(rendered.length > 0, ctx + ': no controls found');
              }
              const state = { ...values };
              for (const [key, current] of rendered) {
                state[key] = current;
              }
              for (const [key, current, choices] of rendered) {
                if (Object.hasOwn(values, key)) {
                  requireCond(current === values[key], ctx + ': ' + key + ' ignored requested value');
                }
                for (const choice of choices) {
                  const variant = { ...state, [key]: choice };
                  const sig = JSON.stringify(Object.entries(variant).sort(([a], [b]) => a.localeCompare(b)));
                  if (!seen.has(sig)) {
                    seen.add(sig);
                    pending.push(variant);
                  }
                }
              }
              count += 1;
            }
            return count;
          }

          function checkActions(rpc, notebook, mirror, notes) {
            let count = 0;
            const action = (actionId, values = {}, { ok = true, tone = null } = {}) => {
              const result = rpc('plugin.action', { action_id: actionId, values });
              const ctx = locale + ' action ' + actionId;
              requireCond(result.ok === ok, ctx + ': unexpected result ' + JSON.stringify(result.status));
              requireCond(Boolean(result.status), ctx + ': missing status');
              if (tone !== null) {
                requireCond(result.tone === tone, ctx + ': expected ' + tone + ' tone, got ' + result.tone);
              }
              checkText(result.status, locale, ctx + '.status', true);
              checkText(result.page, locale, ctx + '.page', true);
              count += 1;
              return result.page;
            };

            const local = {
              protocol: 'local_mirror',
              mirror_dir: mirror,
              selected_notebooks: [notebook],
              conflict_policy: 'keep_both',
            };
            for (const values of [
              { protocol: 'webdav', webdav_url: '' },
              { protocol: 'git', git_remote: '' },
              { ...local, mirror_dir: '' },
              { ...local, mirror_dir: notebook },
            ]) {
              action('save_config', values, { ok: false });
              action('test_conn', values, { ok: false });
            }
            action('sync_now', { ...local, selected_notebooks: [] }, { ok: false });
            action('confirm_sync', {}, { ok: false });
            action('save_config', local);
            action('test_conn', local);

            fs.writeFileSync(path.join(mirror, 'remote.md'), 'Remote fixture', 'utf8');
            const preview = action('sync_now', {}, { tone: 'warning' });
            requireCond(preview.cards.some((card) => card.id === 'preview-card'), 'Missing confirmation preview');
            action('cancel_confirm');
            action('sync_now', {}, { tone: 'warning' });
            action('confirm_sync', {}, { tone: 'success' });
            requireCond(notes['remote.md'] === 'Remote fixture', 'Sync did not pull the fixture');
            requireCond(fs.readFileSync(path.join(mirror, noteName), 'utf8') === notes[noteName], 'Sync did not push the fixture');
            action('sync_now', {}, { tone: 'success' });
            console.log(locale + ': ' + count + ' actions passed');
          }

          async function checkRecovery(rpc, callHost, pkgDir, mirror, dataDir, notes) {
            const localMirror = await import(pathToFileURL(path.join(fs.realpathSync(pkgDir), 'local_mirror.js')).href);
            const recoveryDir = localMirror.recoveryDirForRoot(callHost, mirror, dataDir);
            requireCond(
              recoveryDir.startsWith(path.join(dataDir, 'recovery') + '/') ||
                recoveryDir.startsWith(path.join(dataDir, 'recovery').replace(/\\\\/g, '/') + '/'),
              'recoveryDirForRoot must resolve under data_dir/recovery/'
            );
            requireCond(localMirror.recoveryDirForRoot(() => ({}), mirror, '') === '', 'recoveryDirForRoot must return empty without dataDir');

            const readStashContents = () => {
              if (!fs.existsSync(recoveryDir)) return [];
              return fs
                .readdirSync(recoveryDir)
                .map((name) => [name, fs.readFileSync(path.join(recoveryDir, name), 'utf8')]);
            };

            // 1. Legacy .block-sync-replaced / .block-sync-recovery auto-migration and empty dir removal.
            const legacyReplaced = path.join(mirror, '.block-sync-replaced');
            const legacyRecovery = path.join(mirror, '.block-sync-recovery');
            const recentStashTs = String(Date.now()).padStart(15, '0');
            fs.mkdirSync(legacyReplaced, { recursive: true });
            fs.mkdirSync(legacyRecovery, { recursive: true });
            fs.writeFileSync(path.join(legacyReplaced, recentStashTs + '-1234abcd-legacy-old.md'), 'Legacy replaced content', 'utf8');
            fs.writeFileSync(path.join(legacyRecovery, recentStashTs + '-5678ef01-legacy-rec.md'), 'Legacy recovery content', 'utf8');

            notes['remote.md'] = 'Updated local note';
            fs.writeFileSync(path.join(notebook, 'remote.md'), 'Updated local note', 'utf8');
            const owRes = rpc('plugin.action', { action_id: 'sync_now', values: {} });
            requireCond(owRes.ok === true, 'Overwrite sync failed during recovery check');
            requireCond(!fs.existsSync(legacyReplaced), 'Legacy .block-sync-replaced directory was not removed');
            requireCond(!fs.existsSync(legacyRecovery), 'Legacy .block-sync-recovery directory was not removed');

            let stashed = readStashContents();
            requireCond(
              stashed.some(([, txt]) => txt === 'Legacy replaced content') &&
                stashed.some(([, txt]) => txt === 'Legacy recovery content'),
              'Legacy recovery files were not migrated to data_dir/recovery/<hash>/'
            );
            requireCond(
              stashed.some(([, txt]) => txt === 'Remote fixture'),
              'Overwrite recovery entry did not land in data_dir/recovery/<hash>/'
            );

            // 2. Recoverable deletion lands in data_dir/recovery/<hash>/ without polluting workspace.
            delete notes['remote.md'];
            fs.rmSync(path.join(notebook, 'remote.md'), { force: true });
            const delRes = rpc('plugin.action', { action_id: 'sync_now', values: {} });
            requireCond(delRes.ok === true, 'Delete sync failed during recovery check');
            requireCond(!fs.existsSync(path.join(mirror, 'remote.md')), 'remote.md was not deleted from mirror');
            requireCond(!fs.existsSync(legacyReplaced), 'Workspace .block-sync-replaced recreated');
            requireCond(!fs.existsSync(legacyRecovery), 'Workspace .block-sync-recovery recreated');
            stashed = readStashContents();
            requireCond(
              stashed.some(([, txt]) => txt === 'Updated local note'),
              'Deleted file did not land in data_dir/recovery/<hash>/'
            );

            // 3. EXDEV cross-device rename failure falls back to copy -> stat verify -> delete.
            fs.writeFileSync(path.join(mirror, 'exdev-note.md'), 'Cross device note', 'utf8');
            fs.mkdirSync(legacyReplaced, { recursive: true });
            fs.writeFileSync(path.join(legacyReplaced, recentStashTs + '-deadbeef-exdev-legacy.md'), 'Cross device legacy', 'utf8');
            const exdevCallHost = (method, params = {}) => {
              if (
                method === 'host.fs.rename' &&
                String(params.from || '').startsWith(mirror) &&
                String(params.to || '').startsWith(recoveryDir)
              ) {
                const err = new Error('EXDEV: cross-device link not permitted');
                err.code = 'EXDEV';
                throw err;
              }
              return callHost(method, params);
            };
            const exdevOutcome = localMirror.deleteMirrorEntry(exdevCallHost, mirror, 'exdev-note.md', () => true, {
              dataDir,
            });
            requireCond(exdevOutcome === 'deleted', 'EXDEV deleteMirrorEntry should return deleted');
            localMirror.migrateLegacyRecoveryDirs(exdevCallHost, mirror, { dataDir });
            requireCond(!fs.existsSync(path.join(mirror, 'exdev-note.md')), 'EXDEV source file was not deleted');
            requireCond(!fs.existsSync(legacyReplaced), 'EXDEV legacy .block-sync-replaced was not removed');
            stashed = readStashContents();
            requireCond(
              stashed.some(([, txt]) => txt === 'Cross device note') &&
                stashed.some(([, txt]) => txt === 'Cross device legacy'),
              'EXDEV fallback did not copy files into recovery dir'
            );
            requireCond(
              !stashed.some(([name]) => name.endsWith('.tmp')),
              'EXDEV fallback left temporary files in recovery dir'
            );

            // 4. EXDEV stat mismatch aborts delete and cleans up temp/corrupt copy.
            fs.writeFileSync(path.join(mirror, 'exdev-fail.md'), 'Keep me safe', 'utf8');
            const badStatCallHost = (method, params = {}) => {
              const res = exdevCallHost(method, params);
              if (
                method === 'host.fs.stat' &&
                String(params.path || '').startsWith(recoveryDir + '/') &&
                !String(params.path || '').endsWith('.tmp') &&
                res &&
                res.exists
              ) {
                return { ...res, size: 0 };
              }
              return res;
            };
            let threw = false;
            try {
              localMirror.deleteMirrorEntry(badStatCallHost, mirror, 'exdev-fail.md', () => true, { dataDir });
            } catch (_err) {
              threw = true;
            }
            requireCond(threw, 'EXDEV size mismatch should abort deletion');
            requireCond(
              fs.readFileSync(path.join(mirror, 'exdev-fail.md'), 'utf8') === 'Keep me safe',
              'Source file must be preserved when EXDEV verification fails'
            );
            stashed = readStashContents();
            requireCond(
              !stashed.some(([name]) => name.endsWith('.tmp')) &&
                !stashed.some(([, txt]) => txt === 'Keep me safe'),
              'Failed EXDEV copy left temp or unverified file in recovery dir'
            );
            console.log(locale + ': recovery checks passed');
          }

          async function checkSafetyInvariants(rpc, sdk, pkgDir, notebook, mirror, dataDir, notes) {
            const realPkgDir = fs.realpathSync(pkgDir);
            const localMirror = await import(pathToFileURL(path.join(realPkgDir, 'local_mirror.js')).href);
            const webdavMod = await import(pathToFileURL(path.join(realPkgDir, 'webdav.js')).href);
            const configMod = await import(pathToFileURL(path.join(realPkgDir, 'config.js')).href);
            const hostLocalAdapter = webdavMod.createHostLocalAdapter({ callHost: sdk.callHost });
            const recoveryDir = localMirror.recoveryDirForRoot(sdk.callHost, mirror, dataDir);

            // Issue 8: Unrecognized files in .block-sync-replaced must stay intact and non-empty dir must not be removed.
            const legacyReplaced = path.join(mirror, '.block-sync-replaced');
            fs.mkdirSync(legacyReplaced, { recursive: true });
            const unknownPath = path.join(legacyReplaced, 'notes-backup-do-not-delete.md');
            const recognizedName = String(Date.now()).padStart(15, '0') + '-abcdef12-known.md';
            fs.writeFileSync(unknownPath, 'User extra file', 'utf8');
            fs.writeFileSync(path.join(legacyReplaced, recognizedName), 'Recognized stash content', 'utf8');
            localMirror.migrateLegacyRecoveryDirs(sdk.callHost, mirror, { dataDir });
            requireCond(fs.existsSync(unknownPath) && fs.readFileSync(unknownPath, 'utf8') === 'User extra file', 'Issue 8: unrecognized file must be preserved');
            requireCond(fs.existsSync(legacyReplaced), 'Issue 8: non-empty legacy recovery dir with unknown files must not be removed');
            requireCond(
              fs.readdirSync(recoveryDir).some((n) => fs.readFileSync(path.join(recoveryDir, n), 'utf8') === 'Recognized stash content'),
              'Issue 8: recognized stash file should still migrate cleanly'
            );
            fs.rmSync(legacyReplaced, { recursive: true, force: true });

            // Issue 4: host.fs.delete_data & cleanupRecoveryDirs must reject and skip symlink paths/parents.
            const outsideDir = path.join(tempRoot, 'outside-symlink-target');
            fs.mkdirSync(outsideDir, { recursive: true });
            fs.writeFileSync(path.join(outsideDir, 'keep.txt'), 'Keep me safe', 'utf8');
            const recBase = path.join(dataDir, 'recovery');
            fs.mkdirSync(recBase, { recursive: true });
            const symInsideRec = path.join(recBase, 'sym-dir');
            const symParent = path.join(dataDir, 'sym-parent');
            fs.symlinkSync(outsideDir, symInsideRec, 'dir');
            fs.symlinkSync(outsideDir, symParent, 'dir');
            let symErr1 = false;
            try {
              sdk.callHost('host.fs.delete_data', { path: symInsideRec, recursive: true });
            } catch (_e) {
              symErr1 = true;
            }
            requireCond(symErr1, 'Issue 4: host.fs.delete_data must reject symlink directory');
            let symErr2 = false;
            try {
              sdk.callHost('host.fs.delete_data', { path: path.join(symParent, 'keep.txt'), recursive: false });
            } catch (_e) {
              symErr2 = true;
            }
            requireCond(symErr2, 'Issue 4: host.fs.delete_data must reject file under symlinked parent');
            requireCond(localMirror.deleteDataPath(sdk.callHost, symInsideRec, { recursive: true, baseDir: dataDir }) === false, 'Issue 4: deleteDataPath must return false on symlink');
            localMirror.cleanupRecoveryDirs(sdk.callHost, { dataDir, notebooks: [notebook] });
            requireCond(fs.readFileSync(path.join(outsideDir, 'keep.txt'), 'utf8') === 'Keep me safe', 'Issue 4: symlink target contents must stay intact');
            fs.rmSync(symInsideRec, { force: true });
            fs.rmSync(symParent, { force: true });
            fs.rmSync(outsideDir, { recursive: true, force: true });

            // Issue 1: Unverified notebook identity (identity_verified: false or pre-delete flip) degrades to merge-only and aborts deletion.
            notes['id-protected.md'] = 'Protect this note';
            fs.writeFileSync(path.join(notebook, 'id-protected.md'), 'Protect this note', 'utf8');
            const seedRes = rpc('plugin.action', { action_id: 'sync_now', values: {} });
            requireCond(seedRes.ok === true, 'Issue 1: seed sync failed');

            delete notes['id-protected.md'];
            fs.rmSync(path.join(notebook, 'id-protected.md'), { force: true });
            sdk.state.identityVerified = false;
            const degRes = rpc('plugin.action', { action_id: 'sync_now', values: {} });
            requireCond(degRes.ok === true, 'Issue 1: degraded sync_now failed');
            if (degRes.tone === 'warning') {
              const confDeg = rpc('plugin.action', { action_id: 'confirm_sync', values: {} });
              requireCond(confDeg.ok === true, 'Issue 1: confirm degraded sync failed');
            }
            requireCond(fs.readFileSync(path.join(mirror, 'id-protected.md'), 'utf8') === 'Protect this note', 'Issue 1: remote file must NOT be deleted when identity_verified is false');
            requireCond(notes['id-protected.md'] === 'Protect this note', 'Issue 1: merge-only sync should restore file locally');

            sdk.state.identityVerified = true;
            const nbLstat = fs.lstatSync(notebook);
            const liveRootId = nbLstat.dev + ':' + nbLstat.ino;
            const fakeSwappedStore = {
              state: { homeDir: '', syncMeta: { [configMod.INITIALIZED_META_KEY]: { 'nb:id-test|local_mirror:m': true }, 'nb:id-test|local_mirror:m': { 'gone.md': 'h1' }, [configMod.ROOT_IDENTITIES_META_KEY]: { 'nb:id-test|local_mirror:m': '999:999' } }, notebookIdMap: { by_id: {}, by_path: {}, identities: {}, path_identities: {} }, logs: [] },
              allowLegacyFallback: () => false,
              getBaseMap: (mk) => ({ ...(fakeSwappedStore.state.syncMeta[mk] || {}) }),
              verifyNotebookIdentity: () => ({ identity_ok: false, verified: true, root_identity: liveRootId, recorded_root_identity: '999:999', live_id: 'id-test', reason: 'baseline_identity_mismatch' }),
              lookupTombstoneHash: () => null,
              lookupOtherProtocolHash: () => null,
              recordTombstone: () => false,
              clearTombstone: () => {},
            };
            const mismatchPlan = localMirror.computeThreeWaySyncPlan({
              callHost: sdk.callHost,
              configStore: fakeSwappedStore,
              localAdapter: hostLocalAdapter,
              protocol: 'local_mirror',
              cfg: { sync_scope: 'all', conflict_policy: 'keep_both' },
              nbRoot: notebook,
              nbKeyVal: 'id-test',
              nbLabelVal: 'nb',
              targetDisplay: mirror,
              targetDir: mirror,
              metaKey: 'nb:id-test|local_mirror:m',
              localNotes: {},
              remoteNotes: { 'gone.md': 'h1' },
              remoteInspected: true,
              remoteError: null,
              locale,
            });
            requireCond(mismatchPlan.identity_verified === false && mismatchPlan.is_first_sync === true && mismatchPlan.to_delete_remote.length === 0, 'Issue 1: mismatched root dev+inode must force merge-only first sync without deletions');

            const gitMismatchPlan = localMirror.computeThreeWaySyncPlan({
              callHost: sdk.callHost,
              configStore: fakeSwappedStore,
              localAdapter: hostLocalAdapter,
              protocol: 'git',
              cfg: { sync_scope: 'all', conflict_policy: 'keep_both' },
              nbRoot: notebook,
              nbKeyVal: 'id-test',
              nbLabelVal: 'nb',
              targetDisplay: mirror,
              targetDir: mirror,
              metaKey: 'nb:id-test|git:m',
              localNotes: {},
              remoteNotes: { 'gone.md': 'h1' },
              remoteInspected: true,
              remoteError: null,
              locale,
            });
            requireCond(gitMismatchPlan.identity_verified === false && gitMismatchPlan.is_first_sync === true && gitMismatchPlan.to_delete_remote.length === 0, 'Issue 1 (Git): mismatched root dev+inode must force merge-only first sync without deletions');

            // Mid-sync flip right before Step 4 execution must abort deletion cleanly across local_mirror, git, and webdav.
            const livePlan = localMirror.computeThreeWaySyncPlan({
              callHost: sdk.callHost,
              localAdapter: hostLocalAdapter,
              protocol: 'local_mirror',
              cfg: { sync_scope: 'all', conflict_policy: 'keep_both' },
              nbRoot: notebook,
              nbKeyVal: sdk.state.notebookId,
              nbLabelVal: notebookName,
              targetDisplay: mirror,
              targetDir: mirror,
              metaKey: 'nb:' + sdk.state.notebookId + '|local_mirror:' + mirror,
              localNotes: {},
              remoteNotes: {},
              remoteInspected: true,
              remoteError: null,
              locale,
            });
            livePlan.is_first_sync = false;
            livePlan.identity_verified = true;
            livePlan.to_delete_remote = ['id-protected.md'];
            livePlan.delete_expected_hashes = { 'id-protected.md': 'dummy' };
            sdk.state.identityVerified = false;
            localMirror.applyMirrorOrGitNotebookPlan(livePlan, {
              callHost: sdk.callHost,
              configStore: fakeSwappedStore,
              localAdapter: hostLocalAdapter,
              locale,
              dataDir,
            });
            requireCond(livePlan._deletions_aborted === true, 'Issue 1: Step 4 must abort deletions when live identity turns unverified');
            requireCond(fs.existsSync(path.join(mirror, 'id-protected.md')), 'Issue 1: file must stay intact when Step 4 aborts');

            let davTrashCalled = false;
            const remoteDavBytes = new TextEncoder().encode('Remote keep');
            const remoteDavHash = crypto.createHash('sha256').update(remoteDavBytes).digest('hex');
            const fakeDavClient = {
              listScoped: (_baseUrl, filterFn) => ['gone.md'].filter((p) => (typeof filterFn === 'function' ? filterFn(p) : true)),
              listFiles: (_baseUrl, filterFn) => ['gone.md'].filter((p) => (typeof filterFn === 'function' ? filterFn(p) : true)),
              getBytesWithEtag: (url) => (
                String(url || '').endsWith('/gone.md')
                  ? { found: true, bytes: remoteDavBytes, etag: 'e1' }
                  : { found: false }
              ),
              findCaseVariants: () => [],
              ensureDir: () => ({ ok: true }),
              putText: () => ({ ok: true }),
              putBytes: () => ({ ok: true }),
              putAssetFile: () => ({ ok: true }),
              trashFile: () => { davTrashCalled = true; return 'deleted'; },
            };
            const davStore = configMod.createConfigStore({ callHost: sdk.callHost, supportsSystem: true, supportsMultiNotebook: true, notebookRoot: notebook });
            davStore.loadState();
            const davMetaKey = davStore.metaKey('webdav', 'https://dav.example.invalid/BlockNotes/', sdk.state.notebookId);
            davStore.state.syncMeta[davMetaKey] = { 'gone.md': remoteDavHash };
            davStore.state.syncMeta[configMod.INITIALIZED_META_KEY] = { [davMetaKey]: true };
            davStore.state.syncMeta[configMod.ROOT_IDENTITIES_META_KEY] = { [davMetaKey]: liveRootId };
            const davEngine = webdavMod.createWebDAVSyncEngine({ callHost: sdk.callHost, configStore: davStore, localAdapter: hostLocalAdapter, client: fakeDavClient, locale });
            sdk.state.identityVerified = false;
