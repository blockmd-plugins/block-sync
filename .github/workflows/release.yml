name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Plugin Archive
        run: |
          mkdir -p dist/block-sync
          cp manifest.json main.py README.md dist/block-sync/
          tar -czf "block-sync-${GITHUB_REF_NAME}.tar.gz" -C dist block-sync
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "block-sync-${GITHUB_REF_NAME}.tar.gz" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "block-sync-${GITHUB_REF_NAME}.tar.gz" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
